<!DOCTYPE html>
<html>
  <head>
    <meta charset="utf-8" />
    <title>Redirecting...</title>
    <script type="text/javascript">
      // Redirect to home page but preserve the intended path
      var segmentCount = 0;
      var l = window.location;
      l.replace(
        l.protocol +
          "//" +
          l.hostname +
          (l.port ? ":" + l.port : "") +
          "/shivangitankshali/?redirect=" +
          encodeURIComponent(l.pathname + l.search + l.hash)
      );
    </script>
  </head>
  <body></body>
</html>
